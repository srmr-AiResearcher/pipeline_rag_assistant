[project]
name = "pipeline-rag-assistant"
version = "0.1.0"
description = "RAG-based CI/CD pipeline assembler: retrieve verified template blocks, assemble via LLM, validate before use -- never free-generate pipeline YAML from scratch."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-community>=0.3",
    "langchain-classic>=1.0",
    "langchain-openai>=1.0",
    "langchain-huggingface>=0.1",
    "langchain-google-genai>=2.0",
    "langchain-ollama>=1.1",
    "langchain-chroma>=0.2",
    "rank-bm25>=0.2",
    "pyyaml>=6.0",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
pipeline-rag-assistant = "pipeline_rag_assistant.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline_rag_assistant"]
